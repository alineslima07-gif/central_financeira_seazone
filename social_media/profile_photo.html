<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zenit — Foto de Perfil Universal 800×800</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; gap: 2rem; }
    .info-bar { color: #9aa5b4; font-size: .8rem; }

    .variants { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
    .variant-label { color: #6b7280; font-size: .72rem; text-align: center; margin-top: .5rem; font-family: 'Inter', sans-serif; }

    /* ── VARIANT 1: Z Mark on gradient ── */
    .canvas-v1 {
      width: 400px; height: 400px; border-radius: 50%;
      background: linear-gradient(135deg, #001233 0%, #003580 50%, #0066cc 100%);
      position: relative; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .canvas-v1 .ring { position: absolute; border-radius: 50%; }
    .canvas-v1 .ring-1 { width: 500px; height: 500px; border: 1px solid rgba(0,212,255,.12); }
    .canvas-v1 .ring-2 { width: 380px; height: 380px; border: 1px solid rgba(0,212,255,.08); }
    .canvas-v1 .blob { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(0,212,255,.2), transparent 60%); top: -200px; right: -200px; }
    .canvas-v1 .z-big {
      font-size: 14rem; font-weight: 900; color: transparent;
      background: linear-gradient(135deg, #00d4ff, #0066cc);
      -webkit-background-clip: text; background-clip: text;
      letter-spacing: -.08em; line-height: 1;
      position: relative; z-index: 1;
      text-shadow: none;
      filter: drop-shadow(0 0 40px rgba(0,212,255,.4));
    }

    /* ── VARIANT 2: Box Logo ── */
    .canvas-v2 {
      width: 400px; height: 400px; border-radius: 80px;
      background: linear-gradient(135deg, #001233 0%, #002d70 50%, #0052a3 100%);
      position: relative; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; flex-shrink: 0;
    }
    .canvas-v2 .blob { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(0,212,255,.18), transparent 60%); top: -250px; right: -250px; }
    .canvas-v2 .logo-z {
      width: 160px; height: 160px;
      background: linear-gradient(135deg, #00d4ff, #0066cc);
      border-radius: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 6rem; font-weight: 900; color: #fff;
      box-shadow: 0 16px 48px rgba(0,212,255,.5);
      position: relative; z-index: 1;
    }
    .canvas-v2 .brand { font-size: 3rem; font-weight: 900; color: #fff; letter-spacing: -.04em; position: relative; z-index: 1; }
    .canvas-v2 .sub { font-size: .9rem; color: rgba(255,255,255,.45); letter-spacing: .14em; text-transform: uppercase; position: relative; z-index: 1; }
    .canvas-v2 .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #00d4ff, #28a745); }

    /* ── VARIANT 3: Minimal Dark ── */
    .canvas-v3 {
      width: 400px; height: 400px; border-radius: 50%;
      background: #001233;
      border: 4px solid rgba(0,212,255,.3);
      position: relative; overflow: hidden;
      box-shadow: 0 0 0 8px rgba(0,212,255,.1), 0 20px 60px rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .canvas-v3 .inner {
      width: 260px; height: 260px;
      background: linear-gradient(135deg, #00d4ff, #0066cc);
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 0 60px rgba(0,212,255,.5);
    }
    .canvas-v3 .z { font-size: 8rem; font-weight: 900; color: #fff; letter-spacing: -.08em; line-height: 1; }
  </style>
</head>
<body>
  <div class="info-bar">Foto de Perfil — 800 × 800 px · 3 variações (exibidas em 50%)</div>
  <div class="variants">

    <!-- VARIANT 1 -->
    <div>
      <div class="canvas-v1">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="blob"></div>
        <div class="z-big">Z</div>
      </div>
      <div class="variant-label">Variação 1 — Circular com Z<br>Ideal para: todas as redes</div>
    </div>

    <!-- VARIANT 2 -->
    <div>
      <div class="canvas-v2">
        <div class="blob"></div>
        <div class="logo-z">Z</div>
        <div class="brand">ZENIT</div>
        <div class="sub">Seazone</div>
        <div class="bottom-bar"></div>
      </div>
      <div class="variant-label">Variação 2 — Retangular com marca<br>Ideal para: LinkedIn, YouTube</div>
    </div>

    <!-- VARIANT 3 -->
    <div>
      <div class="canvas-v3">
        <div class="inner">
          <div class="z">Z</div>
        </div>
      </div>
      <div class="variant-label">Variação 3 — Circular minimalista<br>Ideal para: Twitter/X, Instagram</div>
    </div>

  </div>
</body>
</html>
