<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zenit — Facebook Cover 851×315</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
    .info-bar { color: #9aa5b4; font-size: .8rem; margin-bottom: 1rem; font-family: 'Inter', sans-serif; }
    .canvas {
      width: 851px; height: 315px;
      background: linear-gradient(135deg, #001233 0%, #003580 45%, #0066cc 100%);
      position: relative; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    /* geometric shapes */
    .canvas::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,212,255,.18) 0%, transparent 70%);
      top: -180px; right: -100px;
    }
    .canvas::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(40,167,69,.12) 0%, transparent 70%);
      bottom: -120px; left: 100px;
    }

    /* grid lines */
    .grid-lines {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* diagonal accent stripe */
    .stripe {
      position: absolute;
      width: 8px; height: 140%;
      background: linear-gradient(180deg, rgba(0,212,255,.5), rgba(0,212,255,0));
      top: -20%; left: 60%;
      transform: rotate(20deg);
    }
    .stripe-2 {
      position: absolute;
      width: 3px; height: 140%;
      background: linear-gradient(180deg, rgba(245,197,24,.3), rgba(245,197,24,0));
      top: -20%; left: 62%;
      transform: rotate(20deg);
    }

    .content {
      position: absolute; inset: 0;
      display: flex; align-items: center;
      padding: 0 56px;
      gap: 40px;
    }

    .logo-mark {
      width: 88px; height: 88px; flex-shrink: 0;
      background: linear-gradient(135deg, #00d4ff, #0066cc);
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; font-weight: 900; color: white;
      box-shadow: 0 8px 32px rgba(0,212,255,.4);
      letter-spacing: -.05em;
    }

    .text-block { flex: 1; }
    .brand-name {
      font-size: 4rem; font-weight: 900; color: #fff;
      letter-spacing: -.04em; line-height: 1;
    }
    .brand-name span { color: #00d4ff; }
    .tagline {
      font-size: .95rem; font-weight: 300; color: rgba(255,255,255,.7);
      letter-spacing: .12em; text-transform: uppercase; margin-top: .5rem;
    }

    .right-block {
      text-align: right;
      border-left: 1px solid rgba(255,255,255,.1);
      padding-left: 40px;
    }
    .stat {
      margin-bottom: 1rem;
    }
    .stat .value { font-size: 1.6rem; font-weight: 900; color: #00d4ff; line-height: 1; }
    .stat .label { font-size: .7rem; color: rgba(255,255,255,.55); text-transform: uppercase; letter-spacing: .08em; }

    /* bottom bar */
    .bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #00d4ff, #0066cc, #28a745);
    }

    .safe-area-note {
      position: absolute;
      bottom: 14px; right: 18px;
      font-size: .62rem; color: rgba(255,255,255,.25);
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>
  <div class="info-bar">Facebook Cover — 851 × 315 px</div>
  <div class="canvas">
    <div class="grid-lines"></div>
    <div class="stripe"></div>
    <div class="stripe-2"></div>
    <div class="content">
      <div class="logo-mark">Z</div>
      <div class="text-block">
        <div class="brand-name">ZE<span>N</span>IT</div>
        <div class="tagline">No topo das suas finanças</div>
      </div>
      <div class="right-block">
        <div class="stat">
          <div class="value">100%</div>
          <div class="label">Transparência</div>
        </div>
        <div class="stat">
          <div class="value">24/7</div>
          <div class="label">Disponível</div>
        </div>
        <div class="stat">
          <div class="value">+500</div>
          <div class="label">Clientes</div>
        </div>
      </div>
    </div>
    <div class="bottom-bar"></div>
    <div class="safe-area-note">zenit.seazone.com</div>
  </div>
</body>
</html>
