<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zenit — Twitter/X Header 1500×500</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; gap: 1rem; }
    .info-bar { color: #9aa5b4; font-size: .8rem; }

    /* Scale 1500×500 to ~1050×350 */
    .canvas-scaler { transform: scale(0.7); transform-origin: top center; width: 1500px; margin-bottom: -80px; }

    .canvas {
      width: 1500px; height: 500px;
      background: linear-gradient(135deg, #000d20 0%, #001a4d 40%, #003580 70%, #0066cc 100%);
      position: relative; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(0,212,255,.16), transparent 60%); top: -400px; right: -250px; }
    .blob-l { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(40,167,69,.1), transparent 60%); bottom: -300px; left: 100px; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 60px 60px; }

    /* Wave decoration */
    .wave {
      position: absolute; bottom: -2px; left: 0; right: 0;
      opacity: .15;
    }

    /* Diagonal split */
    .split {
      position: absolute; top: 0; bottom: 0;
      left: 65%; right: 0;
      clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
      background: rgba(0,212,255,.04);
      border-left: 1px solid rgba(0,212,255,.1);
    }

    .content {
      position: absolute; inset: 0;
      display: flex; align-items: center;
      padding: 0 90px;
      gap: 70px;
    }

    .logo-mark {
      width: 120px; height: 120px;
      background: linear-gradient(135deg, #00d4ff, #0066cc);
      border-radius: 30px;
      display: flex; align-items: center; justify-content: center;
      font-size: 4.5rem; font-weight: 900; color: #fff;
      box-shadow: 0 16px 48px rgba(0,212,255,.45);
      flex-shrink: 0;
    }

    .text-main { flex: 1; }
    .brand-name { font-size: 6rem; font-weight: 900; color: #fff; letter-spacing: -.05em; line-height: .95; }
    .brand-name em { color: #00d4ff; font-style: normal; }
    .tagline { font-size: 1.05rem; font-weight: 300; color: rgba(255,255,255,.55); letter-spacing: .16em; text-transform: uppercase; margin-top: .75rem; }

    .right-content {
      padding-left: 70px;
      border-left: 1px solid rgba(255,255,255,.1);
      display: flex; flex-direction: column; gap: 1.25rem;
    }

    .pill {
      display: flex; align-items: center; gap: .8rem;
      padding: .9rem 1.4rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      min-width: 280px;
    }
    .pill-icon { font-size: 1.5rem; }
    .pill-text { font-size: .95rem; font-weight: 600; color: #fff; }
    .pill-sub { font-size: .72rem; color: rgba(255,255,255,.45); margin-top: .15rem; }

    .bottom-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #00d4ff, #0066cc 40%, #28a745 75%, #f5c518 100%); }
    .url { position: absolute; bottom: 14px; right: 24px; font-size: .7rem; color: rgba(255,255,255,.25); }
  </style>
</head>
<body>
  <div class="info-bar">Twitter / X Header — 1500 × 500 px</div>
  <div class="canvas-scaler">
    <div class="canvas">
      <div class="blob"></div>
      <div class="blob-l"></div>
      <div class="grid"></div>
      <div class="split"></div>
      <div class="content">
        <div class="logo-mark">Z</div>
        <div class="text-main">
          <div class="brand-name">ZE<em>N</em>IT</div>
          <div class="tagline">No topo das suas finanças</div>
        </div>
        <div class="right-content">
          <div class="pill">
            <div class="pill-icon">📊</div>
            <div><div class="pill-text">Dashboards em Tempo Real</div><div class="pill-sub">KPIs e análises automáticas</div></div>
          </div>
          <div class="pill">
            <div class="pill-icon">💰</div>
            <div><div class="pill-text">Controle Financeiro Total</div><div class="pill-sub">Contas a pagar e receber</div></div>
          </div>
          <div class="pill">
            <div class="pill-icon">🚀</div>
            <div><div class="pill-text">+500 Empresas Confiam</div><div class="pill-sub">A escolha dos líderes</div></div>
          </div>
        </div>
      </div>
      <div class="url">zenit.seazone.com</div>
      <div class="bottom-bar"></div>
    </div>
  </div>
</body>
</html>
