<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zenit — Facebook Post 1200×630</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
    .info-bar { color: #9aa5b4; font-size: .8rem; margin-bottom: 1rem; }
    .canvas {
      width: 1200px; height: 630px;
      background: linear-gradient(135deg, #001233 0%, #002966 55%, #0066cc 100%);
      position: relative; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    /* BG decoration */
    .blob1 {
      position: absolute;
      width: 700px; height: 700px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,212,255,.15), transparent 60%);
      top: -200px; right: -150px;
    }
    .blob2 {
      position: absolute;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(40,167,69,.1), transparent 60%);
      bottom: -150px; left: -80px;
    }
    .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* Diagonal divider */
    .divider {
      position: absolute;
      top: 0; bottom: 0; right: 0;
      width: 420px;
      clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
      background: rgba(255,255,255,.03);
      border-left: 1px solid rgba(255,255,255,.08);
    }

    .content {
      position: absolute; inset: 0;
      display: flex; align-items: center;
      padding: 0 72px;
    }

    .left { flex: 1; padding-right: 60px; }

    .eyebrow {
      font-size: .8rem; font-weight: 600;
      color: #00d4ff; letter-spacing: .18em; text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .headline {
      font-size: 3.2rem; font-weight: 900; color: #fff;
      line-height: 1.05; letter-spacing: -.03em;
      margin-bottom: 1.25rem;
    }
    .headline em { color: #00d4ff; font-style: normal; }
    .body-text {
      font-size: 1.05rem; color: rgba(255,255,255,.65);
      line-height: 1.7; max-width: 480px; margin-bottom: 2rem;
    }
    .cta {
      display: inline-flex; align-items: center; gap: .6rem;
      padding: .85rem 2rem;
      background: linear-gradient(135deg, #28a745, #1d8035);
      border-radius: 10px;
      font-size: 1rem; font-weight: 700; color: #fff;
      box-shadow: 0 6px 24px rgba(40,167,69,.35);
    }
    .cta-arrow { font-size: 1.1rem; }

    .right {
      width: 320px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    }

    .logo-mark {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, #00d4ff, #0066cc);
      border-radius: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; font-weight: 900; color: white;
      box-shadow: 0 12px 40px rgba(0,212,255,.4);
      letter-spacing: -.05em;
    }

    .brand-label { font-size: 2rem; font-weight: 900; color: #fff; letter-spacing: -.04em; }
    .brand-sub { font-size: .78rem; color: rgba(255,255,255,.5); letter-spacing: .14em; text-transform: uppercase; }

    .stats-row { display: flex; gap: 1.5rem; margin-top: .5rem; }
    .stat { text-align: center; }
    .stat .v { font-size: 1.4rem; font-weight: 900; color: #f5c518; }
    .stat .l { font-size: .65rem; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: .08em; }

    .bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #00d4ff 0%, #0066cc 40%, #28a745 80%, #f5c518 100%);
    }
  </style>
</head>
<body>
  <div class="info-bar">Facebook Post — 1200 × 630 px</div>
  <div class="canvas">
    <div class="blob1"></div>
    <div class="blob2"></div>
    <div class="grid"></div>
    <div class="divider"></div>
    <div class="content">
      <div class="left">
        <div class="eyebrow">Gestão Financeira Inteligente</div>
        <div class="headline">Leve suas<br>finanças ao <em>topo</em></div>
        <div class="body-text">Com a Zenit, você tem controle total sobre contas a pagar e receber, dashboards em tempo real e análises avançadas na palma da mão.</div>
        <div class="cta">Comece Agora <span class="cta-arrow">→</span></div>
      </div>
      <div class="right">
        <div class="logo-mark">Z</div>
        <div class="brand-label">ZENIT</div>
        <div class="brand-sub">Seazone Financial</div>
        <div class="stats-row">
          <div class="stat"><div class="v">+500</div><div class="l">Clientes</div></div>
          <div class="stat"><div class="v">24/7</div><div class="l">Suporte</div></div>
          <div class="stat"><div class="v">99%</div><div class="l">Uptime</div></div>
        </div>
      </div>
    </div>
    <div class="bottom-bar"></div>
  </div>
</body>
</html>
